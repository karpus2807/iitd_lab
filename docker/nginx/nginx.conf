worker_processes auto;
events { worker_connections 2048; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip on;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    set $labwatch_api http://api:8000;

    # Variable proxy_pass cannot include a URI path or /api/auth/login becomes /api/ (404).
    location /api/ {
      proxy_pass $labwatch_api$request_uri;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
      proxy_pass $labwatch_api$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }
    location = / {
      proxy_pass $labwatch_api/api/ui/app;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_set_header Host $host;
    }
    location = /labs {
      proxy_pass $labwatch_api/api/ui/infra;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_set_header Host $host;
    }
    location = /updates {
      proxy_pass $labwatch_api/api/ui/updates;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_set_header Host $host;
    }
    location = /login {
      return 302 /;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}
