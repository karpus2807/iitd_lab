services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: labwatch
      POSTGRES_PASSWORD: labwatch
      POSTGRES_DB: labwatch
    volumes:
      - labwatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: &api-build
      context: .
      dockerfile: docker/Dockerfile.api
      pull: false
      args: &proxy-args
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-localhost,127.0.0.1}}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://labwatch:labwatch@db:5432/labwatch
      LABWATCH_REPO_DIR: /opt/labwatch
      LABWATCH_GITHUB_REPO: ${LABWATCH_GITHUB_REPO:-karpus2807/iitd_lab}
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,web,api}
    volumes:
      - ./server/app:/app/app
      - ./VERSION:/app/VERSION:ro
      - .:/opt/labwatch
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; os.environ['NO_PROXY']='127.0.0.1,localhost'; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  updater:
    build: *api-build
    command: ["python3", "-u", "-m", "app.services.updates"]
    environment:
      PYTHONPATH: /app
      LABWATCH_REPO_DIR: /opt/labwatch
      LABWATCH_GITHUB_REPO: ${LABWATCH_GITHUB_REPO:-karpus2807/iitd_lab}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,web,api}
    volumes:
      - ./server/app:/app/app
      - ./VERSION:/app/VERSION:ro
      - .:/opt/labwatch
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      pull: false
      args: *proxy-args
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  labwatch_pg:
