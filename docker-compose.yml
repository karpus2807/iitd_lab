services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labwatch
      POSTGRES_PASSWORD: labwatch
      POSTGRES_DB: labwatch
    volumes:
      - labwatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://labwatch:labwatch@db:5432/labwatch
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  labwatch_pg:
